plugins {
    id 'com.android.application'
}

android {
    namespace 'io.nava.camera'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'io.nava.camera'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a'
            }
        }
    }
	
	signingConfigs {
        release {
            storeFile file("../bruno.jks")
            storePassword "Tetas//2004//"
            keyAlias "brunoKey"
            keyPassword "Tetas//2004//"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Java sources from submodule libraries
            java.srcDirs += [
                '../libs/audio_engine/src/main/java',
                '../libs/archive_engine/src/main/java'
            ]
        }
    }
}

dependencies {
    // audio_engine uses libusb via USB host
}
