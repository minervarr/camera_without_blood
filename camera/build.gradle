plugins {
    id 'com.android.library'
}

android {
    namespace 'io.nava.camera'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        minSdk 26
        // No applicationId / targetSdk / versionCode: this is a library. The host
        // app governs targetSdk at runtime. Output is written to the host's
        // app-specific dir (CameraActivity.cameraOutputDir → getExternalFilesDir),
        // which is scoped-storage-safe regardless of the host's targetSdk.

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a'   // single-ABI: the .aar ships arm64-v8a only
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += [
                "${rootProject.projectDir}/libs/firstparty/app_shell/platform/android/java"
            ]
        }
    }
}

// The Slang -> SPIR-V shader compilation is driven by CMake (vce_compile_slang),
// which writes the .spv files into src/main/assets/shaders. Gradle's asset merge
// has no idea those files are generated, so on a CLEAN clone it runs first,
// packages whatever is already on disk (nothing), and ships an APK missing every
// shader — the canvas ones fail loudly, but the ISP ones just make
// RawVideoPipeline::init() return false and the RAW path silently disappear.
// A second build then "fixes" it, which is how this stays invisible.
//
// Forcing the merge to wait on the native build closes that hole.
afterEvaluate {
    def nativeBuild = tasks.matching { it.name ==~ /buildCMake.*/ }
    tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach {
        dependsOn nativeBuild
    }
}

dependencies {
    // audio_engine's Java is exposed as its own coordinate so a host that also
    // uses it gets a single copy (Gradle dedup). The audio *native* (usb_audio +
    // libusb) is still compiled into libcamera_recorder.so by CMake.
    api project(':engine-audio')
    // archive_engine Java is intentionally NOT a dependency: it was unused
    // (native archive is the local cpp/archive.cc).
}
